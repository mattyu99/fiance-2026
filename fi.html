<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甜心記帳 · 家庭記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --cream: #FFF8F0;
    --cream-deep: #FFF1E0;
    --card: #FFFFFF;
    --peach: #FFB4A2;
    --peach-deep: #FF9478;
    --mint: #9FE0C6;
    --mint-deep: #6BC9A3;
    --butter: #FFD873;
    --butter-deep: #F4B93E;
    --coral: #FF8A7A;
    --ink: #6B4A3E;
    --ink-soft: #9C7E70;
    --line: #F0DFCF;
    --shadow: 0 8px 24px rgba(190, 140, 110, 0.14);
    --shadow-sm: 0 4px 12px rgba(190, 140, 110, 0.12);
    --radius-lg: 28px;
    --radius-md: 20px;
    --radius-sm: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 10% 0%, var(--cream-deep) 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #FFE9DC 0%, transparent 40%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Fredoka', sans-serif; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:96px; }

  header.top{ padding:28px 22px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  header.top .greet{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  header.top .greet .hi{ font-size:12px; color:var(--ink-soft); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .family-name-input{ border:none; background:transparent; font-family:'Fredoka',sans-serif; font-size:24px; font-weight:600; color:var(--ink); padding:0; width:200px; }
  .family-name-input:focus{ outline:none; border-bottom:2px dashed var(--peach); }
  .settings-btn{ width:42px; height:42px; border-radius:50%; background:var(--card); border:none; box-shadow:var(--shadow-sm); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }

  .hero{ margin:6px 18px 18px; background: linear-gradient(160deg, #FFC9B8 0%, var(--peach) 55%, var(--peach-deep) 100%); border-radius: var(--radius-lg); padding:22px 22px 18px; color:#fff; box-shadow: var(--shadow); position:relative; overflow:hidden; }
  .hero::after{ content:""; position:absolute; right:-30px; top:-30px; width:140px; height:140px; background:rgba(255,255,255,0.14); border-radius:50%; }
  .hero .label{ font-size:13px; opacity:0.9; font-weight:700; }
  .hero .amount{ font-family:'Fredoka',sans-serif; font-size:38px; font-weight:600; margin:2px 0 14px; }
  .hero .sub-row{ display:flex; gap:10px; position:relative; z-index:1; }
  .sub-pill{ flex:1; background:rgba(255,255,255,0.22); border-radius:16px; padding:10px 12px; }
  .sub-pill .t{ font-size:11px; opacity:0.9; font-weight:700; }
  .sub-pill .v{ font-size:17px; font-weight:800; margin-top:2px; }

  .piggy-wrap{ position:absolute; right:16px; bottom:10px; width:76px; height:76px; z-index:1; }
  .piggy-wrap svg{ width:100%; height:100%; transition: transform .25s ease; }
  .piggy-bounce{ animation: bounce .5s ease; }
  @keyframes bounce{ 0%{transform:scale(1)} 35%{transform:scale(1.16) rotate(-4deg)} 100%{transform:scale(1)} }

  .section{ margin:22px 18px 0; }
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .section-title h2{ font-size:17px; margin:0; font-weight:600; }
  .link-btn{ background:none; border:none; color:var(--peach-deep); font-weight:800; font-size:13px; cursor:pointer; font-family:'Nunito'; }

  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip{ flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--card); box-shadow:var(--shadow-sm); font-weight:800; font-size:13px; cursor:pointer; border:2px solid transparent; white-space:nowrap; color:var(--ink); }
  .chip.active{ border-color: var(--mint-deep); background:#EAFBF4; }

  .cat-list{ display:flex; flex-direction:column; gap:12px; }
  .cat-card{ background:var(--card); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm); }
  .cat-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cat-name{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; }
  .cat-emoji{ font-size:20px; }
  .cat-amt{ font-size:13px; color:var(--ink-soft); font-weight:700; }
  .bar-track{ height:10px; background:var(--cream-deep); border-radius:99px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--mint), var(--mint-deep)); transition:width .4s ease; }
  .bar-fill.over{ background:linear-gradient(90deg, #FFB199, var(--coral)); }
  .budget-caption{ margin-top:6px; font-size:12px; color:var(--ink-soft); font-weight:700; }

  .tx-list{ display:flex; flex-direction:column; gap:10px; }
  .tx-item{ display:flex; align-items:center; gap:12px; background:var(--card); border-radius:var(--radius-md); padding:12px 14px; box-shadow:var(--shadow-sm); }
  .tx-icon{ width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--cream-deep); flex:0 0 auto; }
  .tx-mid{ flex:1; min-width:0; }
  .tx-mid .n{ font-weight:800; font-size:14px; }
  .tx-mid .m{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-top:1px; }
  .tx-amt{ font-family:'Fredoka'; font-weight:600; font-size:16px; white-space:nowrap; }
  .tx-amt.in{ color:var(--mint-deep); }
  .tx-amt.out{ color:var(--coral); }
  .tx-del{ background:none; border:none; color:#D8C4B6; font-size:16px; cursor:pointer; padding:4px; }
  .empty{ text-align:center; padding:34px 18px; color:var(--ink-soft); font-weight:700; font-size:14px; background:var(--card); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); }

  .member-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .member-card{ background:var(--card); border-radius:var(--radius-md); padding:16px 8px; text-align:center; box-shadow:var(--shadow-sm); position:relative; }
  .member-avatar{ font-size:30px; margin-bottom:6px; }
  .member-card .n{ font-weight:800; font-size:13px; }
  .member-remove{ position:absolute; top:6px; right:6px; background:none; border:none; color:#D8C4B6; cursor:pointer; }
  .add-member-card{ border:2px dashed var(--line); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; color:var(--ink-soft); font-weight:800; font-size:13px; cursor:pointer; background:transparent; padding:16px 8px; }

  nav.bottom{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--card); border-radius:26px 26px 0 0; box-shadow:0 -6px 24px rgba(190,140,110,0.16); display:flex; padding:10px 6px calc(10px + env(safe-area-inset-bottom)); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-soft); font-weight:800; font-size:11px; cursor:pointer; padding:6px 0; font-family:'Nunito'; }
  .nav-btn .ic{ font-size:20px; }
  .nav-btn.active{ color:var(--peach-deep); }

  .fab{ position:fixed; bottom:88px; left:50%; transform:translateX(calc(-50% + 190px)); width:58px; height:58px; border-radius:50%; border:none; cursor:pointer; background:linear-gradient(160deg, var(--butter), var(--butter-deep)); box-shadow:0 8px 18px rgba(244,185,62,0.45); font-size:26px; color:#fff; display:flex; align-items:center; justify-content:center; }

  .overlay{ position:fixed; inset:0; background:rgba(107,74,62,0.35); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .sheet{ background:var(--cream); width:100%; max-width:480px; border-radius:28px 28px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation: slideUp .25s ease; }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .sheet-handle{ width:40px; height:5px; background:var(--line); border-radius:99px; margin:0 auto 14px; }
  .sheet h3{ margin:0 0 16px; font-size:19px; }
  .seg{ display:flex; background:var(--cream-deep); border-radius:16px; padding:4px; margin-bottom:16px; }
  .seg button{ flex:1; border:none; background:none; padding:10px; border-radius:12px; font-weight:800; font-size:14px; color:var(--ink-soft); cursor:pointer; font-family:'Nunito'; }
  .seg button.active.in{ background:var(--mint); color:#fff; }
  .seg button.active.out{ background:var(--coral); color:#fff; }
  label.field{ display:block; font-size:12px; font-weight:800; color:var(--ink-soft); margin:12px 0 6px; }
  input[type=text], input[type=number], input[type=date], select{ width:100%; border:2px solid var(--line); background:#fff; border-radius:14px; padding:12px 14px; font-size:15px; font-family:'Nunito'; font-weight:700; color:var(--ink); }
  input:focus, select:focus{ outline:none; border-color: var(--peach); }
  .emoji-grid, .cat-pick-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .emoji-opt{ width:44px; height:44px; border-radius:14px; background:#fff; border:2px solid var(--line); font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .emoji-opt.active{ border-color: var(--peach); background:#FFF1EA; }
  .cat-pick{ padding:10px 12px; border-radius:14px; background:#fff; border:2px solid var(--line); font-weight:800; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .cat-pick.active{ border-color: var(--mint-deep); background:#EAFBF4; }
  .primary-btn{ width:100%; margin-top:18px; padding:15px; border:none; border-radius:16px; cursor:pointer; background:linear-gradient(160deg, var(--peach), var(--peach-deep)); color:#fff; font-weight:800; font-size:16px; font-family:'Fredoka'; box-shadow: var(--shadow-sm); }
  .google-btn{ width:100%; margin-top:10px; padding:14px; border:2px solid var(--line); border-radius:16px; cursor:pointer; background:#fff; color:var(--ink); font-weight:800; font-size:15px; font-family:'Nunito'; display:flex; align-items:center; justify-content:center; gap:8px; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }
  .budget-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .budget-row .cat-name{ width:110px; flex:0 0 auto; }
  .budget-row input{ flex:1; }
  .note-box{ font-size:12px; color:var(--ink-soft); font-weight:700; line-height:1.6; background:#fff; border-radius:14px; padding:10px 12px; margin-top:8px; }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="greet">
      <span class="hi" id="syncStatus">尚未連接 Google 試算表</span>
      <input id="familyNameInput" class="family-name-input" value="我們家" maxlength="10">
    </div>
    <button class="settings-btn" onclick="openConnectSheet()">🔗</button>
  </header>

  <div class="hero">
    <div class="label">本月結餘</div>
    <div class="amount" id="heroBalance">$0</div>
    <div class="sub-row">
      <div class="sub-pill"><div class="t">💚 本月收入</div><div class="v" id="heroIncome">$0</div></div>
      <div class="sub-pill"><div class="t">🧡 本月支出</div><div class="v" id="heroExpense">$0</div></div>
    </div>
    <div class="piggy-wrap" id="piggyWrap">
      <svg id="piggySvg" viewBox="0 0 100 100">
        <ellipse cx="50" cy="58" rx="34" ry="26" fill="#FFC9C0"/>
        <ellipse cx="26" cy="40" rx="9" ry="9" fill="#FFC9C0"/>
        <ellipse cx="74" cy="40" rx="9" ry="9" fill="#FFC9C0"/>
        <ellipse cx="26" cy="41" rx="4" ry="4" fill="#FF9C90"/>
        <ellipse cx="74" cy="41" rx="4" ry="4" fill="#FF9C90"/>
        <ellipse cx="50" cy="63" rx="13" ry="9" fill="#FF9C90"/>
        <ellipse cx="44" cy="63" rx="2.4" ry="3" fill="#B5665C"/>
        <ellipse cx="56" cy="63" rx="2.4" ry="3" fill="#B5665C"/>
        <circle cx="36" cy="50" r="3.2" fill="#5C4033"/>
        <circle cx="64" cy="50" r="3.2" fill="#5C4033"/>
        <path id="piggyMouth" d="M 42 74 Q 50 80 58 74" stroke="#B5665C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <rect x="46" y="30" width="8" height="4" rx="2" fill="#FF9C90"/>
      </svg>
    </div>
  </div>

  <div id="view-dashboard">
    <div class="section">
      <div class="section-title"><h2>👨‍👩‍👧 依成員篩選</h2></div>
      <div class="chip-row" id="memberFilterRow"></div>
    </div>
    <div class="section">
      <div class="section-title"><h2>🍯 分類與預算</h2><button class="link-btn" onclick="switchView('budget')">設定預算</button></div>
      <div class="cat-list" id="categoryBars"></div>
    </div>
    <div class="section">
      <div class="section-title"><h2>📒 最近記錄</h2><button class="link-btn" onclick="switchView('tx')">查看全部</button></div>
      <div class="tx-list" id="recentTxList"></div>
    </div>
  </div>

  <div id="view-tx" style="display:none;">
    <div class="section">
      <div class="section-title"><h2>📒 所有記錄</h2></div>
      <div class="chip-row" id="txMemberFilterRow" style="margin-bottom:10px;"></div>
      <div class="tx-list" id="allTxList"></div>
    </div>
  </div>

  <div id="view-budget" style="display:none;">
    <div class="section">
      <div class="section-title"><h2>🍯 分類預算設定</h2></div>
      <div id="budgetForm"></div>
      <button class="primary-btn" onclick="saveBudgets()">儲存預算</button>
    </div>
  </div>

  <div id="view-members" style="display:none;">
    <div class="section">
      <div class="section-title"><h2>👨‍👩‍👧‍👦 家庭成員</h2></div>
      <div class="member-grid" id="memberGrid"></div>
    </div>
  </div>

</div>

<button class="fab" onclick="openTxSheet()">＋</button>

<nav class="bottom">
  <button class="nav-btn active" data-view="dashboard" onclick="switchView('dashboard')"><span class="ic">🏠</span>首頁</button>
  <button class="nav-btn" data-view="tx" onclick="switchView('tx')"><span class="ic">📒</span>記錄</button>
  <button class="nav-btn" data-view="budget" onclick="switchView('budget')"><span class="ic">🍯</span>預算</button>
  <button class="nav-btn" data-view="members" onclick="switchView('members')"><span class="ic">👪</span>成員</button>
</nav>

<!-- GOOGLE SHEETS CONNECT SHEET -->
<div class="overlay" id="connectOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>🔗 連接 Google 試算表</h3>
    <p class="note-box">這份記帳本的資料會存在一份 Google 試算表裡，家人只要都連到同一份試算表，記錄就會互相同步。</p>

    <button class="google-btn" id="signInBtn" onclick="signIn()">🔑 使用 Google 帳號登入</button>

    <div id="afterSignInBox" style="display:none;">
      <label class="field">建立一份全新的家庭記帳試算表</label>
      <button class="primary-btn" onclick="createNewSheet()">🆕 建立新的試算表</button>

      <label class="field" style="margin-top:20px;">或者，貼上家人分享給你的試算表 ID</label>
      <input type="text" id="sheetIdInput" placeholder="貼上試算表 ID">
      <button class="primary-btn" onclick="joinSheet()">加入這份試算表</button>

      <div id="shareInfoBox" style="display:none;">
        <p class="note-box" id="shareInfoText"></p>
        <button class="google-btn" onclick="openDriveShare()">📤 開啟 Google 試算表分享設定</button>
      </div>
    </div>
  </div>
</div>

<!-- ADD TRANSACTION SHEET -->
<div class="overlay" id="txOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>新增一筆記帳</h3>
    <div class="seg">
      <button id="segIn" class="in" onclick="setTxType('income')">💚 收入</button>
      <button id="segOut" class="out" onclick="setTxType('expense')">🧡 支出</button>
    </div>
    <label class="field">金額</label>
    <input type="number" id="txAmount" placeholder="0" min="0">
    <label class="field" id="catFieldLabel">分類</label>
    <div class="cat-pick-grid" id="catPickGrid"></div>
    <label class="field">誰花的／誰賺的</label>
    <div class="cat-pick-grid" id="memberPickGrid"></div>
    <div class="row2">
      <div><label class="field">日期</label><input type="date" id="txDate"></div>
      <div><label class="field">備註（選填）</label><input type="text" id="txNote" placeholder="例如：全聯採買"></div>
    </div>
    <button class="primary-btn" onclick="saveTx()">儲存這筆記錄 🐷</button>
  </div>
</div>

<!-- ADD MEMBER SHEET -->
<div class="overlay" id="memberOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>新增家庭成員</h3>
    <label class="field">名字</label>
    <input type="text" id="newMemberName" placeholder="例如：媽媽">
    <label class="field">選一個頭像</label>
    <div class="emoji-grid" id="memberEmojiGrid"></div>
    <button class="primary-btn" onclick="saveMember()">加入家庭 👪</button>
  </div>
</div>

<script>
/* =========================================================================
   設定區：請依照設定教學，把下面這行換成你自己申請的 Google Client ID
   ========================================================================= */
const GOOGLE_CLIENT_ID = '1026741452793-qqhfp1b2lq9q3hj2fmp6q7e14r6gijjv.apps.googleusercontent.com';
const SHEETS_SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
const DRIVE_FILE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

const CATEGORIES = [
  {id:'food', name:'伙食', emoji:'🍚'},
  {id:'transport', name:'交通', emoji:'🚌'},
  {id:'home', name:'居家', emoji:'🏠'},
  {id:'fun', name:'娛樂', emoji:'🎉'},
  {id:'health', name:'醫療', emoji:'💊'},
  {id:'edu', name:'教育', emoji:'📚'},
  {id:'other', name:'其他', emoji:'🛍️'},
];
const MEMBER_EMOJIS = ['👨','👩','👧','👦','👴','👵','🧑','🐱','🐶'];
const LOCAL_CACHE_KEY = 'family-budget-cache-v1';
const SHEET_ID_KEY = 'family-sheet-id';

function defaultState(){ return { familyName:'我們家', members: [], transactions: [], budgets: {} }; }
function loadLocalCache(){ try{ const raw = localStorage.getItem(LOCAL_CACHE_KEY); if(raw) return JSON.parse(raw); }catch(e){} return defaultState(); }
function saveLocalCache(){ try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state)); }catch(e){} }
function getSheetId(){ return localStorage.getItem(SHEET_ID_KEY) || ''; }
function setSheetId(id){ localStorage.setItem(SHEET_ID_KEY, id); }

let state = loadLocalCache();
let currentFilterMember = 'all';
let txType = 'expense';
let selectedCat = CATEGORIES[0].id;
let selectedMember = null;
let selectedMemberEmoji = MEMBER_EMOJIS[0];
let accessToken = null;
let tokenClient = null;
let pollTimer = null;

/* ---------------- Google sign-in ---------------- */
window.addEventListener('load', ()=>{
  const check = setInterval(()=>{
    if(typeof google !== 'undefined' && google.accounts){
      clearInterval(check);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: SHEETS_SCOPE + ' ' + DRIVE_FILE_SCOPE,
        callback: async (resp)=>{
          if(resp.error){ setSyncStatus('⚠️ 登入失敗，請再試一次'); return; }
          accessToken = resp.access_token;
          document.getElementById('signInBtn').textContent = '✅ 已登入 Google';
          document.getElementById('afterSignInBox').style.display = 'block';
          const urlSheetId = new URLSearchParams(location.search).get('sheet');
          if(urlSheetId){ setSheetId(urlSheetId); }
          if(getSheetId()){ await connectToSheet(getSheetId()); closeConnectSheet(); }
          else { setSyncStatus('👤 已登入，請建立或加入試算表'); }
        }
      });
      const urlSheetId = new URLSearchParams(location.search).get('sheet');
      if(urlSheetId) setSheetId(urlSheetId);
      if(GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR') === 0){
        setSyncStatus('⚠️ 尚未設定 Google Client ID');
      } else if(!getSheetId()){
        setSyncStatus('👤 尚未連接試算表');
        openConnectSheet();
      } else {
        setSyncStatus('👤 請登入 Google 以同步');
        openConnectSheet();
      }
      render();
    }
  }, 200);
});

function signIn(){
  if(GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR') === 0){
    alert('這個檔案還沒設定 Google Client ID，請先完成設定教學裡的步驟。');
    return;
  }
  if(!tokenClient){ alert('Google 登入尚未準備好，請重新整理頁面再試一次'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

/* ---------------- Sheets REST helpers ---------------- */
function sheetsBase(id){ return 'https://sheets.googleapis.com/v4/spreadsheets/' + id; }

async function sheetsFetch(url, method, body){
  const res = await fetch(url, {
    method: method || 'GET',
    headers:{ 'Authorization':'Bearer ' + accessToken, 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error('Sheets API ' + res.status + ': ' + t);
  }
  return res.json();
}

async function ensureTabsAndHeaders(id){
  const meta = await sheetsFetch(sheetsBase(id) + '?fields=sheets.properties.title');
  const existing = meta.sheets.map(s=>s.properties.title);
  const needed = ['Transactions','Members','Budgets','Settings'];
  const missing = needed.filter(n=>!existing.includes(n));
  if(missing.length){
    await sheetsFetch(sheetsBase(id) + ':batchUpdate', 'POST', {
      requests: missing.map(title=>({ addSheet:{ properties:{ title } } }))
    });
  }
  await sheetsFetch(sheetsBase(id) + '/values:batchUpdate', 'POST', {
    valueInputOption:'RAW',
    data:[
      {range:'Transactions!A1:G1', values:[['id','type','amount','category','member','date','note']]},
      {range:'Members!A1:C1', values:[['id','name','emoji']]},
      {range:'Budgets!A1:B1', values:[['category','amount']]},
      {range:'Settings!A1:B1', values:[['key','value']]},
    ]
  });
}

async function loadFromSheet(id){
  const data = await sheetsFetch(sheetsBase(id) + '/values:batchGet?ranges=Transactions!A2:G100000&ranges=Members!A2:C1000&ranges=Budgets!A2:B500&ranges=Settings!A2:B10');
  const [txR, memR, budR, setR] = data.valueRanges;
  const transactions = (txR.values||[]).map(r=>({ id:r[0], type:r[1], amount:parseFloat(r[2])||0, category:r[3]||null, member:r[4], date:r[5], note:r[6]||'' }));
  const members = (memR.values||[]).map(r=>({ id:r[0], name:r[1], emoji:r[2] }));
  const budgets = {};
  (budR.values||[]).forEach(r=>{ budgets[r[0]] = parseFloat(r[1])||0; });
  let familyName = '我們家';
  (setR.values||[]).forEach(r=>{ if(r[0]==='familyName') familyName = r[1]; });
  return { familyName, members, transactions, budgets };
}

async function saveToSheet(){
  const id = getSheetId();
  if(!id || !accessToken) return false;
  const txRows = state.transactions.map(t=>[t.id, t.type, t.amount, t.category||'', t.member, t.date, t.note||'']);
  const memRows = state.members.map(m=>[m.id, m.name, m.emoji]);
  const budRows = Object.entries(state.budgets).map(([k,v])=>[k,v]);
  const setRows = [['familyName', state.familyName]];
  await sheetsFetch(sheetsBase(id) + '/values:batchClear', 'POST', {
    ranges:['Transactions!A2:G100000','Members!A2:C1000','Budgets!A2:B500','Settings!A2:B10']
  });
  const data = [
    {range:'Members!A2', values: memRows},
    {range:'Budgets!A2', values: budRows},
    {range:'Settings!A2', values: setRows},
  ];
  if(txRows.length) data.unshift({range:'Transactions!A2', values: txRows});
  await sheetsFetch(sheetsBase(id) + '/values:batchUpdate', 'POST', { valueInputOption:'RAW', data: data.filter(d=>d.values.length>0) });
  return true;
}

/* ---------------- Connect / create / join sheet ---------------- */
function openConnectSheet(){ document.getElementById('connectOverlay').classList.add('show'); }
function closeConnectSheet(){ document.getElementById('connectOverlay').classList.remove('show'); }
document.getElementById('connectOverlay').addEventListener('click', e=>{ if(e.target.id==='connectOverlay') closeConnectSheet(); });

async function createNewSheet(){
  if(!accessToken){ alert('請先登入 Google'); return; }
  setSyncStatus('☁️ 建立試算表中…');
  try{
    const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
      method:'POST',
      headers:{ 'Authorization':'Bearer ' + accessToken, 'Content-Type':'application/json' },
      body: JSON.stringify({ properties:{ title: (state.familyName||'我們家') + ' - 家庭記帳本' } })
    });
    const data = await res.json();
    setSheetId(data.spreadsheetId);
    await connectToSheet(data.spreadsheetId);
    const shareBox = document.getElementById('shareInfoBox');
    shareBox.style.display = 'block';
    document.getElementById('shareInfoText').textContent =
      '試算表建立好了！請點下面按鈕開啟 Google 試算表，右上角「共用」給家人的 Gmail（權限選「編輯者」）。之後把這個網址加上 ?sheet=' + data.spreadsheetId + ' 傳給家人，他們登入後就會自動加入。';
    window._newSheetUrl = data.spreadsheetUrl;
  }catch(e){
    console.error(e);
    setSyncStatus('⚠️ 建立試算表失敗');
    alert('建立試算表失敗，請確認已啟用 Google Sheets API。');
  }
}
function openDriveShare(){ if(window._newSheetUrl) window.open(window._newSheetUrl, '_blank'); }

async function joinSheet(){
  const id = document.getElementById('sheetIdInput').value.trim();
  if(!id){ alert('請貼上試算表 ID'); return; }
  setSheetId(id);
  await connectToSheet(id);
  closeConnectSheet();
}

async function connectToSheet(id){
  setSyncStatus('☁️ 連接試算表中…');
  try{
    await ensureTabsAndHeaders(id);
    const data = await loadFromSheet(id);
    state = data;
    saveLocalCache();
    render();
    setSyncStatus('☁️ 已與家人的試算表同步');
    startPolling();
  }catch(e){
    console.error(e);
    setSyncStatus('⚠️ 無法連接，請確認試算表 ID 與權限');
  }
}

async function pushState(){
  saveLocalCache();
  if(accessToken && getSheetId()){
    setSyncStatus('☁️ 同步中…');
    try{ await saveToSheet(); setSyncStatus('☁️ 已與家人的試算表同步'); }
    catch(e){ console.error(e); setSyncStatus('⚠️ 同步失敗，稍後重試'); }
  } else {
    setSyncStatus('👤 尚未連接試算表（僅本機）');
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if(document.visibilityState!=='visible' || !accessToken || !getSheetId()) return;
    try{
      const fresh = await loadFromSheet(getSheetId());
      if(JSON.stringify(fresh) !== JSON.stringify(state)){
        state = fresh; saveLocalCache(); render();
        setSyncStatus('☁️ 已更新家人的最新記錄');
      }
    }catch(e){}
  }, 8000);
}

function fmt(n){ return '$' + Math.round(n).toLocaleString(); }
function isThisMonth(dateStr){ const d=new Date(dateStr), n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); }
function setSyncStatus(t){ const el=document.getElementById('syncStatus'); if(el) el.textContent = t; }

document.getElementById('familyNameInput').value = state.familyName || '我們家';
document.getElementById('familyNameInput').addEventListener('input', e=>{ state.familyName = e.target.value; pushState(); });
document.getElementById('txDate').valueAsDate = new Date();

/* ---------------- View switching ---------------- */
function switchView(name){
  ['dashboard','tx','budget','members'].forEach(v=>{ document.getElementById('view-'+v).style.display = (v===name)?'block':'none'; });
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='budget') renderBudgetForm();
  if(name==='members') renderMembers();
  if(name==='tx') renderAllTx();
}

/* ---------------- Rendering ---------------- */
function render(){
  document.getElementById('familyNameInput').value = state.familyName || '我們家';
  renderHero(); renderMemberFilterChips(); renderCategoryBars(); renderRecentTx(); renderAllTx(); renderMembers();
}
function filteredMonthTx(){ return state.transactions.filter(t => isThisMonth(t.date) && (currentFilterMember==='all' || t.member===currentFilterMember)); }

function renderHero(){
  const txs = filteredMonthTx();
  const income = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;
  document.getElementById('heroIncome').textContent = fmt(income);
  document.getElementById('heroExpense').textContent = fmt(expense);
  document.getElementById('heroBalance').textContent = (balance<0?'-':'') + fmt(Math.abs(balance));
  document.getElementById('piggyMouth').setAttribute('d', balance>=0 ? 'M 42 74 Q 50 80 58 74' : 'M 42 78 Q 50 72 58 78');
}
function bouncePiggy(){ const el=document.getElementById('piggyWrap'); el.classList.remove('piggy-bounce'); void el.offsetWidth; el.classList.add('piggy-bounce'); }

function renderMemberFilterChips(){
  [document.getElementById('memberFilterRow'), document.getElementById('txMemberFilterRow')].forEach(row=>{
    row.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.className = 'chip' + (currentFilterMember==='all'?' active':'');
    allChip.textContent = '全部';
    allChip.onclick = ()=>{ currentFilterMember='all'; render(); };
    row.appendChild(allChip);
    state.members.forEach(m=>{
      const c = document.createElement('button');
      c.className = 'chip' + (currentFilterMember===m.id?' active':'');
      c.textContent = m.emoji + ' ' + m.name;
      c.onclick = ()=>{ currentFilterMember=m.id; render(); };
      row.appendChild(c);
    });
  });
}

function renderCategoryBars(){
  const wrap = document.getElementById('categoryBars'); wrap.innerHTML = '';
  const txs = filteredMonthTx().filter(t=>t.type==='expense');
  CATEGORIES.forEach(cat=>{
    const spent = txs.filter(t=>t.category===cat.id).reduce((s,t)=>s+t.amount,0);
    const budget = state.budgets[cat.id] || 0;
    if(spent===0 && budget===0) return;
    const pct = budget>0 ? Math.min(100,(spent/budget)*100) : (spent>0?100:0);
    const over = budget>0 && spent>budget;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `<div class="cat-top"><div class="cat-name"><span class="cat-emoji">${cat.emoji}</span>${cat.name}</div><div class="cat-amt">${fmt(spent)}${budget>0?' / '+fmt(budget):''}</div></div><div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>${budget>0?`<div class="budget-caption">${over?'😢 已超出這個月的預算囉':'😊 還在預算內，繼續保持！'}</div>`:''}`;
    wrap.appendChild(card);
  });
  if(wrap.innerHTML==='') wrap.innerHTML = '<div class="empty">還沒有支出紀錄，先去記一筆吧 🍡</div>';
}

function txRowHtml(t){
  const cat = CATEGORIES.find(c=>c.id===t.category) || {emoji:'💰',name:'收入'};
  const member = state.members.find(m=>m.id===t.member);
  return `<div class="tx-item"><div class="tx-icon">${t.type==='income'?'💰':cat.emoji}</div><div class="tx-mid"><div class="n">${t.note?t.note:(t.type==='income'?'收入':cat.name)}</div><div class="m">${member?member.emoji+' '+member.name+' · ':''}${t.date}</div></div><div class="tx-amt ${t.type==='income'?'in':'out'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div><button class="tx-del" onclick="deleteTx('${t.id}')">✕</button></div>`;
}
function renderRecentTx(){
  const list = document.getElementById('recentTxList');
  const txs = [...state.transactions].filter(t=>currentFilterMember==='all'||t.member===currentFilterMember).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  list.innerHTML = txs.length ? txs.map(txRowHtml).join('') : '<div class="empty">還沒有任何記錄，點右下角的 ＋ 開始記帳吧 🌸</div>';
}
function renderAllTx(){
  const list = document.getElementById('allTxList');
  const txs = [...state.transactions].filter(t=>currentFilterMember==='all'||t.member===currentFilterMember).sort((a,b)=>new Date(b.date)-new Date(a.date));
  list.innerHTML = txs.length ? txs.map(txRowHtml).join('') : '<div class="empty">還沒有任何記錄，點右下角的 ＋ 開始記帳吧 🌸</div>';
}
function deleteTx(id){ state.transactions = state.transactions.filter(t=>t.id!==id); pushState(); render(); }

function renderMembers(){
  const grid = document.getElementById('memberGrid'); grid.innerHTML = '';
  state.members.forEach(m=>{
    const card = document.createElement('div');
    card.className = 'member-card';
    card.innerHTML = `<button class="member-remove" onclick="removeMember('${m.id}')">✕</button><div class="member-avatar">${m.emoji}</div><div class="n">${m.name}</div>`;
    grid.appendChild(card);
  });
  const addCard = document.createElement('button');
  addCard.className = 'add-member-card';
  addCard.innerHTML = '<span style="font-size:22px;">＋</span><span>新增成員</span>';
  addCard.onclick = openMemberSheet;
  grid.appendChild(addCard);
}
function removeMember(id){ if(!confirm('確定要移除這位成員嗎？（過去的紀錄仍會保留）')) return; state.members = state.members.filter(m=>m.id!==id); pushState(); render(); }

function renderBudgetForm(){
  document.getElementById('budgetForm').innerHTML = CATEGORIES.map(cat => `<div class="budget-row"><div class="cat-name">${cat.emoji} ${cat.name}</div><input type="number" min="0" placeholder="月預算" data-cat="${cat.id}" value="${state.budgets[cat.id]||''}"></div>`).join('');
}
function saveBudgets(){
  document.querySelectorAll('#budgetForm input').forEach(inp=>{ const v=parseFloat(inp.value); state.budgets[inp.dataset.cat] = isNaN(v)?0:v; });
  pushState(); render(); switchView('dashboard');
}

/* ---------------- Add Transaction sheet ---------------- */
function openTxSheet(){
  if(state.members.length===0){ alert('先到「成員」頁新增一位家庭成員，才能記帳唷 👪'); switchView('members'); return; }
  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';
  document.getElementById('txDate').valueAsDate = new Date();
  setTxType('expense');
  selectedMember = currentFilterMember!=='all' ? currentFilterMember : state.members[0].id;
  renderCatPickGrid(); renderMemberPickGrid();
  document.getElementById('txOverlay').classList.add('show');
}
function closeTxSheet(){ document.getElementById('txOverlay').classList.remove('show'); }
document.getElementById('txOverlay').addEventListener('click', e=>{ if(e.target.id==='txOverlay') closeTxSheet(); });
function setTxType(type){
  txType = type;
  document.getElementById('segIn').classList.toggle('active', type==='income');
  document.getElementById('segOut').classList.toggle('active', type==='expense');
  document.getElementById('catFieldLabel').style.display = type==='income' ? 'none' : 'block';
  document.getElementById('catPickGrid').style.display = type==='income' ? 'none' : 'flex';
}
function renderCatPickGrid(){
  document.getElementById('catPickGrid').innerHTML = CATEGORIES.map(c=>`<div class="cat-pick ${selectedCat===c.id?'active':''}" onclick="pickCat('${c.id}')">${c.emoji} ${c.name}</div>`).join('');
}
function pickCat(id){ selectedCat = id; renderCatPickGrid(); }
function renderMemberPickGrid(){
  document.getElementById('memberPickGrid').innerHTML = state.members.map(m=>`<div class="cat-pick ${selectedMember===m.id?'active':''}" onclick="pickMember('${m.id}')">${m.emoji} ${m.name}</div>`).join('');
}
function pickMember(id){ selectedMember = id; renderMemberPickGrid(); }
function saveTx(){
  const amount = parseFloat(document.getElementById('txAmount').value);
  if(!amount || amount<=0){ alert('請輸入金額唷 💸'); return; }
  if(!selectedMember){ alert('請選擇是誰的記錄 👪'); return; }
  state.transactions.push({ id:'tx_'+Date.now(), type:txType, amount, category: txType==='expense'?selectedCat:null, member:selectedMember, date: document.getElementById('txDate').value || new Date().toISOString().slice(0,10), note: document.getElementById('txNote').value.trim() });
  pushState(); closeTxSheet(); render(); bouncePiggy();
}

/* ---------------- Add Member sheet ---------------- */
function openMemberSheet(){
  document.getElementById('newMemberName').value = '';
  selectedMemberEmoji = MEMBER_EMOJIS[0];
  renderMemberEmojiGrid();
  document.getElementById('memberOverlay').classList.add('show');
}
function closeMemberSheet(){ document.getElementById('memberOverlay').classList.remove('show'); }
document.getElementById('memberOverlay').addEventListener('click', e=>{ if(e.target.id==='memberOverlay') closeMemberSheet(); });
function renderMemberEmojiGrid(){
  document.getElementById('memberEmojiGrid').innerHTML = MEMBER_EMOJIS.map(e=>`<div class="emoji-opt ${selectedMemberEmoji===e?'active':''}" onclick="pickMemberEmoji('${e}')">${e}</div>`).join('');
}
function pickMemberEmoji(e){ selectedMemberEmoji = e; renderMemberEmojiGrid(); }
function saveMember(){
  const name = document.getElementById('newMemberName').value.trim();
  if(!name){ alert('請輸入名字唷 ✏️'); return; }
  state.members.push({ id:'m_'+Date.now(), name, emoji: selectedMemberEmoji });
  pushState(); closeMemberSheet(); render();
}

render();
</script>
